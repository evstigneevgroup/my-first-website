<svg xmlns="http://www.w3.org/2000/svg" width="820" height="860" viewBox="0 0 820 860" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="860" fill="#ffffff"/>

  <!-- ================= ЗАГОЛОВОК ================= -->
  <text x="410" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1d22">ДОМ 30 м² — ПЛАНИРОВКА</text>
  <text x="410" y="62" text-anchor="middle" font-size="12.5" fill="#5a6472">Габарит 5,48 × 5,48 м · размеры в метрах · наружные стены 220 мм, перегородки 120 мм</text>

  <!-- ================= ПЯТНО ЗАСТРОЙКИ ================= -->
  <rect x="110" y="90" width="548" height="548" fill="#2f3540"/>

  <!-- ================= ПОЛЫ ПОМЕЩЕНИЙ ================= -->
  <rect x="132" y="112" width="504" height="322" fill="#faf7f1"/>
  <rect x="132" y="446" width="244" height="170" fill="#eef4f9"/>
  <rect x="388" y="446" width="248" height="170" fill="#e8f4f1"/>

  <!-- ================= ПЕРЕГОРОДКИ ================= -->
  <rect x="132" y="434" width="504" height="12" fill="#2f3540"/>
  <rect x="376" y="446" width="12" height="170" fill="#2f3540"/>

  <!-- ================= ПРОЁМЫ (двери и окна) ================= -->
  <rect x="240" y="616" width="90" height="22" fill="#ffffff"/>    <!-- входная дверь -->
  <rect x="220" y="434" width="90" height="12" fill="#ffffff"/>    <!-- дверь в спальню -->
  <rect x="376" y="450" width="12" height="80" fill="#ffffff"/>    <!-- дверь в санузел -->

  <rect x="250" y="90" width="240" height="22" fill="#dbe7f2"/>    <!-- окно спальни (2,40 м) -->
  <rect x="110" y="210" width="22" height="160" fill="#dbe7f2"/>   <!-- окно спальни (1,60 м) -->
  <rect x="636" y="466" width="22" height="60" fill="#dbe7f2"/>    <!-- окно санузла (0,60 м) -->
  <line x1="250" y1="101" x2="490" y2="101" stroke="#7b8794" stroke-width="1.2"/>
  <line x1="121" y1="210" x2="121" y2="370" stroke="#7b8794" stroke-width="1.2"/>
  <line x1="647" y1="466" x2="647" y2="526" stroke="#7b8794" stroke-width="1.2"/>

  <!-- ================= СПАЛЬНЯ (мебель) ================= -->
  <!-- кухонная зона — опция -->
  <rect x="132" y="112" width="240" height="70" fill="#f5f2ec" stroke="#b9c2cc" stroke-width="1.3" stroke-dasharray="6 5"/>
  <line x1="132" y1="152" x2="372" y2="152" stroke="#d3d9e0" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="252" y="140" text-anchor="middle" font-size="10" fill="#8c98a6">кухонная зона</text>
  <text x="252" y="171" text-anchor="middle" font-size="10" fill="#8c98a6">(опция)</text>

  <!-- шкаф -->
  <rect x="516" y="112" width="120" height="60" fill="#e8ecf1" stroke="#6b7684" stroke-width="1.5"/>
  <line x1="576" y1="112" x2="576" y2="172" stroke="#6b7684" stroke-width="1"/>

  <!-- кровать 1600 × 2000, изголовье у правой стены -->
  <rect x="436" y="190" width="200" height="160" rx="8" fill="#e8ecf1" stroke="#6b7684" stroke-width="1.5"/>
  <rect x="446" y="200" width="140" height="140" rx="6" fill="#dfe6ee"/>
  <rect x="598" y="202" width="32" height="136" rx="8" fill="#ffffff" stroke="#9aa6b4" stroke-width="1.2"/>

  <!-- стол -->
  <circle cx="350" cy="275" r="45" fill="#f2ede4" stroke="#6b7684" stroke-width="1.5"/>

  <text x="228" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#2f3540">СПАЛЬНЯ</text>
  <text x="228" y="255" text-anchor="middle" font-size="12.5" fill="#5a6472">16,2 м²</text>

  <!-- ================= ПРИХОЖАЯ (входная группа) ================= -->
  <rect x="132" y="446" width="60" height="170" fill="#e8ecf1" stroke="#6b7684" stroke-width="1.5"/>
  <line x1="132" y1="506" x2="192" y2="506" stroke="#6b7684" stroke-width="1"/>
  <line x1="132" y1="531" x2="192" y2="531" stroke="#6b7684" stroke-width="1"/>
  <circle cx="162" cy="476" r="16" fill="#ffffff" stroke="#9aa6b4" stroke-width="1.2"/>
  <text x="162" y="480" text-anchor="middle" font-size="8" fill="#8c98a6">С/М</text>
  <text x="162" y="571" text-anchor="middle" font-size="9.5" fill="#8c98a6" transform="rotate(-90 162 571)">шкаф 600</text>

  <text x="262" y="492" text-anchor="middle" font-size="14" font-weight="700" fill="#2f3540">ПРИХОЖАЯ</text>
  <text x="262" y="510" text-anchor="middle" font-size="12" fill="#5a6472">входная группа · 4,2 м²</text>

  <!-- ================= САНУЗЕЛ ================= -->
  <!-- душ 900 × 900 -->
  <rect x="546" y="526" width="90" height="90" fill="#dbe8f0" stroke="#6b7684" stroke-width="1.5"/>
  <line x1="546" y1="616" x2="636" y2="526" stroke="#6b7684" stroke-width="1"/>
  <circle cx="591" cy="571" r="5" fill="#ffffff" stroke="#6b7684" stroke-width="1"/>
  <!-- унитаз -->
  <rect x="500" y="598" width="40" height="18" fill="#dbe8f0" stroke="#6b7684" stroke-width="1.5"/>
  <ellipse cx="520" cy="568" rx="18" ry="24" fill="#eaf3f8" stroke="#6b7684" stroke-width="1.5"/>
  <!-- раковина -->
  <rect x="400" y="572" width="56" height="38" rx="4" fill="#dbe8f0" stroke="#6b7684" stroke-width="1.5"/>
  <ellipse cx="428" cy="591" rx="19" ry="11" fill="#ffffff" stroke="#9aa6b4" stroke-width="1"/>

  <text x="516" y="486" text-anchor="middle" font-size="14" font-weight="700" fill="#2f3540">САНУЗЕЛ</text>
  <text x="516" y="504" text-anchor="middle" font-size="12" fill="#5a6472">4,2 м²</text>

  <!-- ================= ПОЛОТНА ДВЕРЕЙ ================= -->
  <line x1="240" y1="616" x2="240" y2="526" stroke="#2f3540" stroke-width="2.5"/>
  <path d="M 330 616 A 90 90 0 0 0 240 526" fill="none" stroke="#8c98a6" stroke-width="1.2"/>

  <line x1="310" y1="434" x2="310" y2="344" stroke="#2f3540" stroke-width="2.5"/>
  <path d="M 220 434 A 90 90 0 0 1 310 344" fill="none" stroke="#8c98a6" stroke-width="1.2"/>

  <line x1="388" y1="530" x2="468" y2="530" stroke="#2f3540" stroke-width="2.5"/>
  <path d="M 388 450 A 80 80 0 0 1 468 530" fill="none" stroke="#8c98a6" stroke-width="1.2"/>

  <!-- ================= ВХОД ================= -->
  <path d="M 285 640 L 279 652 L 291 652 Z" fill="#2f3540"/>
  <text x="285" y="668" text-anchor="middle" font-size="11" font-weight="700" fill="#2f3540">ВХОД</text>

  <!-- ================= РАЗМЕРЫ ================= -->
  <!-- габарит снизу -->
  <line x1="110" y1="716" x2="658" y2="716" stroke="#8c98a6" stroke-width="1"/>
  <line x1="110" y1="710" x2="110" y2="722" stroke="#8c98a6" stroke-width="1"/>
  <line x1="658" y1="710" x2="658" y2="722" stroke="#8c98a6" stroke-width="1"/>
  <text x="384" y="709" text-anchor="middle" font-size="13" fill="#5a6472">5,48 м (габарит)</text>

  <!-- внутренние ширины: прихожая / санузел -->
  <line x1="132" y1="638" x2="132" y2="688" stroke="#c3cbd4" stroke-width="0.8"/>
  <line x1="376" y1="638" x2="376" y2="688" stroke="#c3cbd4" stroke-width="0.8"/>
  <line x1="388" y1="638" x2="388" y2="688" stroke="#c3cbd4" stroke-width="0.8"/>
  <line x1="636" y1="638" x2="636" y2="688" stroke="#c3cbd4" stroke-width="0.8"/>
  <line x1="132" y1="684" x2="636" y2="684" stroke="#8c98a6" stroke-width="1"/>
  <line x1="132" y1="679" x2="132" y2="689" stroke="#8c98a6" stroke-width="1"/>
  <line x1="376" y1="679" x2="376" y2="689" stroke="#8c98a6" stroke-width="1"/>
  <line x1="388" y1="679" x2="388" y2="689" stroke="#8c98a6" stroke-width="1"/>
  <line x1="636" y1="679" x2="636" y2="689" stroke="#8c98a6" stroke-width="1"/>
  <text x="254" y="678" text-anchor="middle" font-size="11" fill="#8c98a6">2,44</text>
  <text x="512" y="678" text-anchor="middle" font-size="11" fill="#8c98a6">2,48</text>

  <!-- габарит слева -->
  <line x1="58" y1="90" x2="58" y2="638" stroke="#8c98a6" stroke-width="1"/>
  <line x1="52" y1="90" x2="64" y2="90" stroke="#8c98a6" stroke-width="1"/>
  <line x1="52" y1="638" x2="64" y2="638" stroke="#8c98a6" stroke-width="1"/>
  <text x="40" y="364" text-anchor="middle" font-size="13" fill="#5a6472" transform="rotate(-90 40 364)">5,48 м (габарит)</text>

  <!-- глубины справа: спальня / входная группа -->
  <line x1="658" y1="112" x2="700" y2="112" stroke="#c3cbd4" stroke-width="0.8"/>
  <line x1="658" y1="434" x2="700" y2="434" stroke="#c3cbd4" stroke-width="0.8"/>
  <line x1="658" y1="446" x2="700" y2="446" stroke="#c3cbd4" stroke-width="0.8"/>
  <line x1="658" y1="616" x2="700" y2="616" stroke="#c3cbd4" stroke-width="0.8"/>
  <line x1="690" y1="112" x2="690" y2="434" stroke="#8c98a6" stroke-width="1"/>
  <line x1="685" y1="112" x2="695" y2="112" stroke="#8c98a6" stroke-width="1"/>
  <line x1="685" y1="434" x2="695" y2="434" stroke="#8c98a6" stroke-width="1"/>
  <line x1="690" y1="446" x2="690" y2="616" stroke="#8c98a6" stroke-width="1"/>
  <line x1="685" y1="446" x2="695" y2="446" stroke="#8c98a6" stroke-width="1"/>
  <line x1="685" y1="616" x2="695" y2="616" stroke="#8c98a6" stroke-width="1"/>
  <text x="676" y="273" text-anchor="middle" font-size="11" fill="#8c98a6" transform="rotate(-90 676 273)">3,22 м</text>
  <text x="676" y="531" text-anchor="middle" font-size="11" fill="#8c98a6" transform="rotate(-90 676 531)">1,70 м</text>

  <!-- ================= ПОЯСНЕНИЯ ================= -->
  <line x1="70" y1="726" x2="750" y2="726" stroke="#e2e7ed" stroke-width="1"/>
  <text x="70" y="748" font-size="13.5" font-weight="700" fill="#1a1d22">СОСТАВ ПОМЕЩЕНИЙ</text>
  <text x="70" y="770" font-size="12" fill="#3c4450">1. Входная группа (прихожая) — 4,2 м²: стиральная машина 600×600, шкаф 600, обувница, крючки, зеркало.</text>
  <text x="70" y="790" font-size="12" fill="#3c4450">2. Санузел — 4,2 м²: душ 900×900, унитаз, раковина 560, полотенцесушитель.</text>
  <text x="70" y="810" font-size="12" fill="#3c4450">3. Спальня — 16,2 м²: кровать 1600×2000, шкаф 1200×600, стол Ø900.</text>
  <text x="70" y="832" font-size="11" fill="#8c98a6">Пунктир — кухонная зона (опция). Окна: спальня 2400 + 1600 мм, санузел 600 мм.</text>
</svg>
